name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go 1.26 quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Install formatting and nilness tools
        run: |
          go install mvdan.cc/gofumpt@latest
          go install golang.org/x/tools/cmd/goimports@latest
          go install go.uber.org/nilaway/cmd/nilaway@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify formatting
        run: |
          test -z "$(gofumpt -l .)"
          test -z "$(goimports -local github.com/jageros/mintegral-go -l .)"

      - name: Test
        run: go test -shuffle=on -count=1 ./...

      - name: Race test
        run: go test -race -shuffle=on -count=1 ./...

      - name: Public examples
        run: go test -run '^Example' ./...

      - name: Vet
        run: go vet ./...

      - name: Nilness analysis
        run: nilaway ./...

      - name: Build
        run: go build ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.4.0
          args: --timeout=5m ./...
