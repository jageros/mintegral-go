name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go 1.26 quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Go 1.26
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Install formatting and nilness tools
        run: |
          go install mvdan.cc/gofumpt@v0.11.0
          go install golang.org/x/tools/cmd/goimports@v0.48.0
          go install go.uber.org/nilaway/cmd/nilaway@v0.0.0-20260808063849-8649a03c818a
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify formatting
        run: |
          test -z "$(gofumpt -l .)"
          test -z "$(goimports -local github.com/jageros/mintegral-go -l .)"

      - name: Test
        run: go test -shuffle=on -count=1 ./...

      - name: Race test
        run: go test -race -shuffle=on -count=1 ./...

      - name: Public examples
        run: go test -run '^Example' ./...

      - name: Vet
        run: go vet ./...

      - name: Nilness analysis
        run: nilaway ./...

      - name: Build
        run: go build ./...

      - name: Lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.10.1
          args: --timeout=5m ./...
